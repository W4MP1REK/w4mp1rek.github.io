<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikacja Kuriera</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <!-- Modal logowania -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <h2>Podaj PIN</h2>
            <form id="login-form">
                <input type="password" id="pin-input" maxlength="4" placeholder="****" required>
                <button type="submit">Zaloguj</button>
            </form>
        </div>
    </div>

    <!-- Główna zawartość aplikacji -->
    <div id="app-content" style="display: none;">
        <header>
            <h1>Rozliczenia Kurierskie</h1>
            <button id="logout-btn">Wyloguj</button>
        </header>

        <main class="container">
            <!-- Nawigacja Kalendarza -->
            <section class="calendar-section">
                <div class="calendar-header">
                    <button id="prev-month">&lt;</button>
                    <h2 id="calendar-month-year"></h2>
                    <button id="next-month">&gt;</button>
                </div>
                <div id="calendar-grid" class="calendar-grid"></div>
            </section>

            <!-- Formularz Dnia -->
            <section class="form-section">
                <h3 id="selected-date-title">Wybrany dzień: -</h3>
                <form id="daily-form">
                    <div class="form-group">
                        <label for="address">Adres:</label>
                        <input type="number" id="address" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="apm">APM (Paczkomaty):</label>
                        <input type="number" id="apm" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="pudo">PUDO (Punkty):</label>
                        <input type="number" id="pudo" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="pickups">Odbiory:</label>
                        <input type="number" id="pickups" min="0" value="0">
                    </div>

                    <!-- Nowa opcja: Druga zmiana -->
                    <div class="form-group" style="margin-top: 15px;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold;">
                            <input type="checkbox" id="second-shift" style="width: 20px; height: 20px;">
                            Druga zmiana (+150 zł)
                        </label>
                    </div>

                    <div class="daily-summary">
                        <p>Łącznie paczek: <strong id="daily-total-parcels">0</strong></p>
                        <p>Stawka za dzień: <strong id="daily-rate">0.00 zł</strong></p>
                    </div>

                    <button type="submit" class="btn-save">Zapisz dzień</button>
                </form>
            </section>

            <!-- Statystyki Miesięczne -->
            <section class="stats-section">
                <h3>Statystyki Miesięczne</h3>
                <div class="form-group">
                    <label for="stats-month-select">Wybierz miesiąc:</label>
                    <select id="stats-month-select"></select>
                </div>

                <div class="stats-cards">
                    <div class="card">
                        <h4>Suma paczek</h4>
                        <p id="stat-monthly-parcels">0</p>
                    </div>
                    <div class="card">
                        <h4>Wyliczona kwota</h4>
                        <p id="stat-monthly-earnings">0.00 zł</p>
                    </div>
                </div>

                <div class="stats-details">
                    <p>Adres: <span id="stat-address">0</span></p>
                    <p>APM: <span id="stat-apm">0</span></p>
                    <p>PUDO: <span id="stat-pudo">0</span></p>
                    <p>Odbiory: <span id="stat-pickups">0</span></p>
                </div>

                <hr>

                <!-- Przelewy -->
                <div class="payout-section">
                    <h4>Rozliczenie Przelewu</h4>
                    <div class="form-group">
                        <label>Wyliczone wynagrodzenie:</label>
                        <input type="text" id="calculated-payout" readonly>
                    </div>
                    <div class="form-group">
                        <label for="received-payout">Otrzymany przelew (zł):</label>
                        <input type="number" id="received-payout" step="0.01" placeholder="0.00">
                    </div>
                    <button id="save-payout-btn" class="btn-save">Zapisz przelew</button>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
